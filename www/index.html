 inp.value=v;sp.textContent=txt;if(p.dp)sp.classList.toggle("ph",!v);
 ddClose();b.focus();if(cb)cb(v)}

function ddClick(e){var p=DDP;if(!p)return;
 if(p.tp){tmClick(e.target);return}
 if(p.cl){if(e.target.closest("[data-t=ok]"))clCommit();return}
 var o=e.target.closest(".ddo");
 if(o){var q=p.d.o[+o.getAttribute("data-i")];ddSet(String(q[0]),q[1]);return}
 var x=e.target.closest("[data-d],[data-a]");if(!x)return;
 if(x.hasAttribute("data-d")){var s=x.getAttribute("data-d");ddSet(s,dpLbl(s));return}
 var a=x.getAttribute("data-a");
 if(a==="clr"){ddSet("",dpLbl(""));return}
 if(a==="hoy"){var s2=dpS(new Date());ddSet(s2,dpLbl(s2));return}
 var m=p.m+(+a),dt=new Date(p.y,m,1);p.y=dt.getFullYear();p.m=dt.getMonth();dpDraw();
 var nb=p.el.querySelector('.dpn[data-a="'+a+'"]');if(nb)nb.focus()}

function dpDraw(){var p=DDP,y=p.y,m=p.m,sel=p.inp.value,td=dpS(new Date()),off=(new Date(y,m,1).getDay()+6)%7,st=new Date(y,m,1-off);
 var h='<div class="dph"><button type="button" class="dpn" data-a="-1" aria-label="Mes anterior">&#8249;</button><b aria-live="polite">'+DMES[m]+" "+y+'</b><button type="button" class="dpn" data-a="1" aria-label="Mes siguiente">&#8250;</button></div>'
 +'<div class="dpw" aria-hidden="true">'+["L","M","X","J","V","S","D"].map(function(x){return"<span>"+x+"</span>"}).join("")+'</div><div class="dpg">';
 var fm=p.f&&dpP(p.f)&&dpP(p.f).getMonth()===m&&dpP(p.f).getFullYear()===y,tab=fm?p.f:y+"-"+dpZ(m+1)+"-01";
 for(var i=0;i<42;i++){var d=new Date(st.getFullYear(),st.getMonth(),st.getDate()+i),s=dpS(d);
  h+='<button type="button" class="dpd'+(d.getMonth()!==m?" out":"")+(s===td?" td":"")+(s===sel?" on":"")+'" data-d="'+s+'" tabindex="'+(s===tab?0:-1)+'" aria-label="'+d.toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+'"'+(s===sel?' aria-pressed="true"':"")+'>'+d.getDate()+'</button>'}
 h+='</div><div class="dpf"><button type="button" data-a="clr">Quitar fecha</button><button type="button" data-a="hoy">Hoy</button></div>';
 p.el.innerHTML=h}

function ddKd(e){var p=DDP;if(!p)return;var k=e.key;
 if(k==="Escape"){e.preventDefault();e.stopPropagation();var b=p.b;ddClose();b.focus();return}
 if(p.tp||p.cl)return;
 if(k==="Tab"){ddClose();return}
 if(!p.dp){
  if(k==="ArrowDown"){e.preventDefault();ddAct(p.i+1)}else if(k==="ArrowUp"){e.preventDefault();ddAct(p.i-1)}
  else if(k==="Home"){e.preventDefault();ddAct(0)}else if(k==="End"){e.preventDefault();ddAct(1e9)}
  else if(k==="Enter"||k===" "){e.preventDefault();var q=p.d.o[p.i];if(q)ddSet(String(q[0]),q[1])}
  return}
 var t=e.target.closest&&e.target.closest(".dpd");if(!t)return;
 var s=t.getAttribute("data-d"),d=dpP(s),n=null;
 if(k==="ArrowLeft")n=new Date(d.getFullYear(),d.getMonth(),d.getDate()-1);
 else if(k==="ArrowRight")n=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
 else if(k==="ArrowUp")n=new Date(d.getFullYear(),d.getMonth(),d.getDate()-7);
 else if(k==="ArrowDown")n=new Date(d.getFullYear(),d.getMonth(),d.getDate()+7);
 else if(k==="PageUp")n=new Date(d.getFullYear(),d.getMonth()-1,d.getDate());
 else if(k==="PageDown")n=new Date(d.getFullYear(),d.getMonth()+1,d.getDate());
 if(!n)return;e.preventDefault();p.f=dpS(n);p.y=n.getFullYear();p.m=n.getMonth();dpDraw();
 var f=p.el.querySelector('.dpd[data-d="'+p.f+'"]');if(f)f.focus()}
</script>
